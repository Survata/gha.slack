# Runs on every push to a non-master branch and validates that linting, the unit
# tests, and the bundle build all pass before the change is merged.
name: check commit

on:
  push:
    branches-ignore:
      - master

concurrency:
  group: check-commit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check actions are pinned
        # Supply-chain guard: fail if any non-Survata action isn't pinned to a full commit
        # SHA (Survata/gha.* exempt via .pinact.yml). Reuses this job's runner — no extra one.
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          fix: "false"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Build bundle
        run: yarn package
