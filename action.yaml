name: 'Slack'
description: 'GitHub action which sends Slack messages'
inputs:
  type:
    description: 'Type of Slack message'
    required: true
  status:
    description: 'success (default) or failure — drives the header emoji and colour bar'
    required: false
    default: success
  token:
    description: 'The Slack access token'
    required: true
  channel:
    description: 'The Slack channel to post to'
    required: true
    default: CFSRFSGP8
runs:
  using: 'node20'
  main: 'bin/index.js'
