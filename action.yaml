name: 'Slack'
description: 'GitHub action which sends Slack messages'
inputs:
  type:
    description: 'Type of Slack message'
    required: true
  status:
    description: 'success or failure — sets the header emoji and colour bar. Omit for a plain message with no status indicator.'
    required: false
  token:
    description: 'The Slack access token'
    required: true
  channel:
    description: 'The Slack channel to post to'
    required: true
    default: CFSRFSGP8
runs:
  using: 'node24'
  main: 'bin/index.js'
